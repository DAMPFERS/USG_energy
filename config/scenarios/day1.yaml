# ============================================================================
#  Сценарий игрового дня. Один файл = один день.
#  Время — «HH:MM» (время купола). Мощность — кВт, энергия — кВт·ч.
# ============================================================================

day: "Day 1 — Base Deployment"
# date: 2026-10-07            # если указано — сценарий активен только в эту дату
start: "08:00"                # начало игрового дня (до него — ожидание, баланс не считается)
end: "20:00"                  # конец игрового дня
forecast_csv: ../../data/forecast_day1.csv   # прогноз солнца: time,forecast_kw,sigma_kw
history_step_s: 30            # шаг записи истории (игровые секунды)

# --------------------------------------------------------------------------- АКБ
# max_charge_kw / max_discharge_kw — номинал; peak_discharge_kw — кратковременный пик.
# overload_tolerance_s — сколько секунд АКБ терпит разряд выше номинала, затем уходит
#   в защиту (status: fault) на fault_recovery_min минут.
# efficiency — КПД заряда; self_discharge_pct_h — саморазряд, % ёмкости в час.
# status: ok | degraded | failed
batteries:
  - id: A
    name: "BAT-1 Li-ion"
    description: "High capacity, medium power"
    capacity_kwh: 20
    charge_kwh: 12
    max_charge_kw: 4
    max_discharge_kw: 4
    peak_discharge_kw: 6
    efficiency: 0.95
    overload_tolerance_s: 120
    fault_recovery_min: 15
  - id: B
    name: "BAT-2 Lead-acid"
    description: "Reliable but slow"
    capacity_kwh: 12
    charge_kwh: 8
    max_charge_kw: 2
    max_discharge_kw: 3
    peak_discharge_kw: 3.5
    efficiency: 0.85
    overload_tolerance_s: 30
    fault_recovery_min: 10
  - id: C
    name: "Supercapacitor"
    description: "Low capacity, huge power, self-discharge"
    capacity_kwh: 3
    charge_kwh: 2
    max_charge_kw: 8
    max_discharge_kw: 10
    peak_discharge_kw: 15
    efficiency: 0.98
    self_discharge_pct_h: 5
    overload_tolerance_s: 300
    fault_recovery_min: 5
active_battery: A

# --------------------------------------------------------------------------- по умолчанию
# Действуют, когда текущий момент не попадает ни в одну фазу.
# Последствия (on_overload / on_underload / on_deficit):
#   grace_s       — сколько игровых секунд нарушение терпится (участники видят обратный отсчёт)
#   trip          — что отключить: auto (самые мощные, пока не уйдём из нарушения) | all |
#                   top:N (N самых мощных) | [3, 7] (конкретные линии)
#   duration_min  — на сколько минут линии блокируются
#   message, level — сообщение в терминал
defaults:
  corridor: {min_kw: 2.0, max_kw: 9.0}
  solar_factor: 1.0
  on_overload:  {grace_s: 30, trip: auto, duration_min: 10}
  on_underload: {grace_s: 60, trip: all,  duration_min: 5}
  on_deficit:   {grace_s: 15, trip: auto, duration_min: 10}

# --------------------------------------------------------------------------- фазы
# Интервалы [from, to). Внутри фазы действуют её коридор, коэффициент солнца,
# блокировки линий (номер линии или ключ потребителя из server.yaml) и (опционально) свои последствия. message — пишется в терминал
# в начале фазы. batteries — изменения АКБ в начале фазы.
phases:
  - name: "Morning start-up"
    from: "08:00"
    to: "10:00"
    corridor: {min_kw: 3.0, max_kw: 8.0}
    message:
      level: INFO
      text: |
        Good morning, dispatcher. The crew is waking up and starting life support systems.
        Power corridor: 3.0–8.0 kW. The sun is rising, rely on the batteries.

  - name: "Science programme"
    from: "10:00"
    to: "12:00"
    corridor: {min_kw: 5.0, max_kw: 10.0}
    message: "Laboratory experiments are starting. Allowed corridor: 5.0–10.0 kW."

  - name: "Sandstorm"
    from: "12:00"
    to: "14:00"
    corridor: {min_kw: 3.0, max_kw: 6.0}
    solar_factor: 0.3          # фактическая генерация = 30% от прогноза
    locked_lines:
      WS-S2: "Workshop machinery is shut down for the duration of the storm"
    on_overload: {grace_s: 15, trip: auto, duration_min: 15}
    message:
      level: CRIT
      text: |
        ALERT! A sandstorm has engulfed the dome. Solar panel output has dropped.
        Corridor narrowed to 3.0–6.0 kW, overload protection tightened (15 s).

  - name: "After the storm"
    from: "14:00"
    to: "15:00"
    corridor: {min_kw: 4.0, max_kw: 9.0}
    solar_factor: 0.8
    message: {level: OK, text: "The storm is subsiding. Panels are being cleaned, generation is recovering."}

  - name: "Airlock repair"
    from: "15:00"
    to: "18:00"
    corridor: {min_kw: 6.0, max_kw: 11.0}
    message: "The crew is repairing the airlock: the welding station needs power. Corridor: 6.0–11.0 kW."

  - name: "Evening mode"
    from: "18:00"
    to: "20:00"
    corridor: {min_kw: 2.0, max_kw: 6.0}
    message: "Evening. The sun is setting: reduce the load to a minimum and save charge for the night."

# --------------------------------------------------------------------------- события
# Разовые события. at — время. Можно: message (+level), batteries (изменить параметры АКБ),
# lock_lines {lines (номера или ключи потребителей), duration_min, reason} — авария на линиях, set_active_battery.
events:
  - at: "07:58"
    level: INFO
    message: "Link to the dome established. The dispatcher shift starts at 08:00."

  - at: "11:40"
    level: WARN
    message: "Weather service: a dust front is approaching the dome, expected at 12:00. Charge the batteries!"

  - at: "15:30"
    level: WARN
    message: "Diagnostics: BAT-2 has overheated, capacity reduced to 7 kWh, rated discharge 2 kW."
    batteries:
      B: {status: degraded, capacity_kwh: 7, max_discharge_kw: 2, peak_discharge_kw: 2.5}

  - at: "16:30"
    level: CRIT
    message: "Short circuit in the Bioreactor (sockets 2)! The line is de-energized for 20 minutes of repair."
    lock_lines: {lines: [BIO-S2], duration_min: 20, reason: "Short circuit, repair in progress"}

  - at: "17:30"
    level: CRIT
    message: "BAT-2 failure: open cell. The storage unit is out of service until the end of the day."
    batteries:
      B: {status: failed}
