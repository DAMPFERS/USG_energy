# Конфигурация сервера энергосистемы купола.
# Пути — относительно корня проекта.

host: 0.0.0.0
port: 8000
admin_token: "root"          # для /api/admin/* (заголовок X-Admin-Token)

scenario: config/scenarios/mission.yaml   # сценарий игры: начало, длительность, прогноз, сообщения
logs_dir: logs
static_dir: static

# Часы игры:
#   mode: real — реальное время (боевой режим); время купола = системное время машины
#   mode: sim  — отладка: старт с start (марсианское «сол ЧЧ:ММ», по умолчанию — за 2 мин до начала),
#                ускорение speed (20 = час за 3 минуты). Точка отсчёта хранится в logs/clock_<сценарий>.json,
#                чтобы после перезапуска время продолжилось; новый start подхватится после --reset.
clock:
  mode: real
  start: "1 11:28"
  speed: 20

# Аккумулятор купола (один). Меняется из админки (bat ...), изменения записываются сюда.
battery:
  name: "Dome battery"
  capacity_kwh: 40          # ёмкость, кВт·ч
  initial_kwh: 25           # заряд на старте игры, кВт·ч
  max_charge_kw: 5          # макс. мощность заряда: избыток генерации выше неё — нарушение нижней границы
  max_discharge_kw: 6       # макс. мощность разряда

# Правила игры. Меняются из админки (max ..., set ...), изменения записываются сюда.
# Время — игровое (в режиме sim идёт быстрее).
rules:
  max_kw: 900                 # верхняя граница коридора потребления, кВт
  overload_grace_min: 50     # потребление выше max_kw: через сколько минут блэкаут (все линии выкл, без блокировки)
  surplus_grace_min: 50      # генерация − потребление > max_charge_kw: через сколько минут отключится АКБ
  battery_off_min: 15       # на сколько минут отключается АКБ
  deficit_grace_s: 10       # потребление > генерация + разряд АКБ: через сколько секунд отключать линии
  deficit_lock_min: 15      # на сколько минут блокируются линии, отключённые при дефиците
  clear_s: 10               # сколько секунд нарушения не должно быть, чтобы предупреждение снялось

# Телеметрия для ЦУП (описание протокола — ISG_Energy_telemetry.md):
#   GET /api/telemetry, /api/telemetry/meta, /api/telemetry/forecast, /api/telemetry/history
#   WS  /ws/telemetry
telemetry:
  token: ""                 # пусто — без авторизации; иначе X-Telemetry-Token или ?token=
  push_interval_s: 2.0      # период отправки среза по WebSocket (реальные секунды)
  battery_voltage_v: 24     # номинальное напряжение АКБ для пересчёта в А и А·ч (в сценарии можно задать voltage_v у АКБ)
  forecast_step_min: 5      # шаг прогноза W(t) по умолчанию
  cors_origins: ["*"]       # с каких веб-страниц разрешены запросы GET (для панели ЦУП в браузере)

relay_poll_s: 2.0     # период опроса реле
engine_tick_s: 2.0    # период расчёта баланса

# Генерация = солнце (data/forecast.csv) × (1 − запылённость (data/dust.csv)) × коэффициент админа
# (команда solar: 0 после бури, затем подкручивать по мере очистки панелей) × (1 ± флуктуации).
solar:
  source: sim             # сейчас — модель по прогнозу; позже — реальные панели
  interval_s: 2.0
  fluctuation_pct: 5      # флуктуации генерации, % (участники видят прогноз солнца ± это значение)
  correlation: 0.97       # 0..1, чем ближе к 1, тем плавнее флуктуации

# Потребители купола (ключ — для команд админки и сценария, name — что видят участники).
# Какой линии (реле) соответствует какой потребитель, задаётся на площадке из админки:
#   name <линия> <ключ>       → сохраняется в line_map (по умолчанию — по порядку списка)
consumers:
  - {key: HAB1-S,  name: "HAB 1 · Sockets"}
  - {key: HAB2-S,  name: "HAB 2 · Sockets"}
  - {key: FAB-S1,  name: "FABLAB · Sockets 1"}
  - {key: FAB-S2,  name: "FABLAB · Sockets 2"}
  - {key: BIO-S1,  name: "BIOLAB · Sockets 1"}
  - {key: BIO-S2,  name: "BIOLAB · Sockets 2"}
  - {key: MAIN-S1, name: "MAIN · Sockets 1"}
  - {key: MAIN-S2, name: "MAIN · Sockets 2"}
  - {key: HAB1-L,  name: "HAB 1 · Lighting"}
  - {key: HAB2-L,  name: "HAB 2 · Lighting"}
  - {key: FAB-L,   name: "FABLAB · Lighting"}
  - {key: BIO-L,   name: "BIOLAB · Lighting"}
  - {key: MAIN-L,  name: "MAIN · Lighting"}
line_map: config/line_map.yaml

# Линии (реле) 1–13. driver: sim — эмулятор, tuya — реальное реле TONGOU (данные из smart_rele/devices.json).
# scale: игровые кВт = измеренные реле кВт * scale (лампа 60 Вт при scale 20 = 1.2 кВт купола).
# Пример реального реле:
#   - {id: 1, driver: tuya, scale: 1, tuya: {device_id: "...", local_key: "...", ip: "192.168.8.89", version: 3.5}}
lines:
  - {id: 1,  driver: sim, sim: {base_kw: 1.0, variability: 0.08}}
  - {id: 2,  driver: sim, sim: {base_kw: 0.9, variability: 0.05}}
  - {id: 3,  driver: sim, sim: {base_kw: 1.6, variability: 0.15}}
  - {id: 4,  driver: sim, sim: {base_kw: 1.2, variability: 0.10}}
  - {id: 5,  driver: sim, sim: {base_kw: 1.1, variability: 0.06}}
  - {id: 6,  driver: sim, sim: {base_kw: 0.8, variability: 0.05}}
  - {id: 7,  driver: sim, sim: {base_kw: 1.3, variability: 0.12}}
  - {id: 8,  driver: sim, sim: {base_kw: 0.7, variability: 0.05}}
  - {id: 9,  driver: sim, sim: {base_kw: 0.4, variability: 0.02}}
  - {id: 10, driver: sim, sim: {base_kw: 0.3, variability: 0.02}}
  - {id: 11, driver: sim, sim: {base_kw: 0.5, variability: 0.03}}
  - {id: 12, driver: sim, sim: {base_kw: 0.4, variability: 0.02}}
  - {id: 13, driver: sim, sim: {base_kw: 0.3, variability: 0.02}}

